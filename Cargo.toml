[workspace]
members = ["crates/content", "crates/site", "crates/ripple"]
exclude = ["games/memory"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.dependencies]
leptos = { version = "=0.8.20", default-features = false, features = ["ssr"] }
site-content = { path = "crates/content" }

[profile.release.package.ripple-engine]
opt-level = "s"
