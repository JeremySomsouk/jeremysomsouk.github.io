name: Cabane checks

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'games/**'
      - 'scripts/**'
      - '.github/workflows/cabane-checks.yml'
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'games/**'
      - 'scripts/**'
      - '.github/workflows/cabane-checks.yml'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript tests
        run: node --test scripts/*.test.mjs
      - name: JavaScript syntax and whitespace
        run: |
          for file in docs/cabane/lumiere/*.mjs docs/cabane/river/*.mjs; do node --check "$file"; done
          git diff --check
      - name: Rust tests and Wasm build
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup component add clippy --toolchain 1.96.0
          rustup target add wasm32-unknown-unknown --toolchain 1.96.0
          rustup run 1.96.0 cargo test --manifest-path games/memory/Cargo.toml
          rustup run 1.96.0 cargo clippy --manifest-path games/memory/Cargo.toml --all-targets -- -D warnings
          bash scripts/build-games.sh
      - name: Build static artifact
        run: SITE_BUILD_DATE="$(date -u +%F)" cargo run --locked --release -p site
      - name: Verify published game files
        run: |
          for file in docs/cabane/lumiere/*; do
            cmp "$file" "target/site-preview/cabane/lumiere/$(basename "$file")"
          done
          for file in docs/cabane/river/*; do
            cmp "$file" "target/site-preview/cabane/river/$(basename "$file")"
          done
          cmp docs/cabane/memory/game.wasm target/site-preview/cabane/memory/game.wasm
