name: Cabane checks

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/cabane-checks.yml'
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/cabane-checks.yml'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript tests
        run: node --test scripts/*.test.mjs
      - name: JavaScript syntax and whitespace
        run: |
          for file in docs/cabane/lumiere/*.mjs; do node --check "$file"; done
          git diff --check
      - name: Production Jekyll build
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - name: Verify published game files
        run: |
          for file in docs/cabane/lumiere/*; do
            cmp "$file" "_site/cabane/lumiere/$(basename "$file")"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cabane-site
          path: _site/
          retention-days: 7
