name = "somsouk-games-api"
main = "worker.mjs"
workers_dev = true
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ALLOWED_ORIGINS = "https://www.somsouk.fr,https://somsouk.fr,http://localhost:8787,http://127.0.0.1:8787"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "GuessRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GuessRoom"]
