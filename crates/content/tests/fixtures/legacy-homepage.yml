# About section
about_profile_image: images/profile.webp
about_content: |
  Hi, my name's Jeremy and I'm a software engineer. I have worked for several companies gaining teamwork and hard skills but above all, soft skills to lead projects from the ground up.

  I am most skilled in: <mark>Java</mark> and making <mark>phở</mark>

  And I am still learning how to be a <mark>great dad</mark> and that kind of leave me sleepless sometimes, but that is worth all the riches of the world.

  <a class="projects-jump" href="#personal-projects">Discover my projects ↓</a>

# Main content section
content:
  - title: Things I’m building
    layout: text
    content: |
      <div id="personal-projects" class="project-grid">
        <article class="project-card project-card-melimo" aria-labelledby="melimo-title">
          <img class="project-preview" src="/images/melimo-player.png" alt="Mélimo terminal player showing a music queue and synchronized lyrics with fictional demo tracks" width="1024" height="654" loading="lazy">
          <div class="project-body">
            <h4 id="melimo-title">Mélimo</h4>
            <p class="project-tagline">Your music, in your terminal.</p>
            <p>A lightweight music player built in Rust. Search and stream audio with Deezer or Invidious, build one queue, and control playback from your keyboard. Explore your Deezer playlists and follow synchronized lyrics when available.</p>
            <ul class="project-tags" aria-label="Mélimo technologies and platforms"><li>Rust</li><li>Terminal UI</li><li>macOS &amp; Linux</li></ul>
            <p class="project-note">Invidious instances are selected automatically for audio streaming. An unofficial client for both providers.</p>
            <a class="project-link" href="https://github.com/JeremySomsouk/Melimo">Explore on GitHub →</a>
          </div>
        </article>
        <article class="project-card project-card-cabane" aria-labelledby="cabane-title">
          <img class="project-preview" src="/cabane/images/welcome.webp" alt="Illustrated welcome to La cabane à découvertes" width="800" height="800" loading="lazy">
          <div class="project-body">
            <h4 id="cabane-title">La cabane à découvertes</h4>
            <p class="project-tagline">A little place to learn, play, and explore.</p>
            <p>A collection of playful browser activities for curious minds. Practice reading, match illustrated cards, solve puzzles, and experiment with light and water.</p>
            <ul class="project-tags" aria-label="Cabane features and technologies"><li>Learning through play</li><li>Browser games</li><li>Rust &amp; WebAssembly</li></ul>
            <a class="project-link" href="/cabane/">Enter the cabane →</a>
          </div>
        </article>
      </div>
  - title: Experience
    layout: list
    content:
      - layout: left
        title: Doctolib
        link: doctolib.fr
        sub_title: Software engineer
        caption: 2026 - Present
        description: |
          Building the technical foundations of Doctolib's digital health strategy for patients.

          Continuous preventive care: developing the patient "Care Plan", a health suggestion and reminder engine for consultations, screenings and examinations based on public health authority recommendations. The goal is to make Doctolib a trusted health advisor, able to proactively plan preventive care so patients do not have to remember it themselves.

          Parental support: designing onboarding journeys and baby development tracking experiences, with personalized content, smart notifications and daily activities.
      - layout: left
        title: BlaBlaCar
        link: blablacar.com
        sub_title: Software engineer
        caption: 2020 - 2025
        description: |
          Development within several teams of back-end developers for the development of the BlaBlaCar bus, carpooling inventory technical platform, and user experience. 
          - Migration of route search for different partners
          - Added discount display for bus trip details
          - Integrated the Zendesk application using our internal APIs
          - Migration and improvement of legacy PHP code bases to Java
          - Designed and implemented user experiences for drivers and user profiles
      - layout: left
        title: Streamroot Lumen
        link: streamroot.io
        sub_title: Software engineer
        caption: 2022
        description: |
          Making data services safer and easier to develop.
          - Migration of Google cloud data instances from one project to another
          - Addition of CI/CD pipelines for the data projects
      - layout: left
        title: Happn
        link: happn.com
        sub_title: Software engineer
        caption: 2017 - 2020
        description: |
          Developing within a team of 13 back-end developers for the maintenance of the happn API and the creation of new Java microservices.
          - Leading the specifications and design of new features
          - Improvements and maintenance of Java back-end microservices
          - Creation of a microservice of data storage for CRM purposes
  - title: Education
    layout: list
    content:
      - layout: left
        title: EPITA
        caption: 2012 - 2017
        sub_title: Systems, Networks and Security Engineer diploma
        #quote: >
        #  "Created 30 years ago, the EPITA computer intelligence engineering school trains those who design, develop and advance information technologies."
        description: |
          During my time at EPITA I learned the most teamwork and rigor which I try to carry on in my career. I thoroughly enjoyed my time at this school and learned how to learn fast new technologies and becoming an all around engineer.

          Even though I did a specialization in security the last two years of school, I realized quickly that my main interest was still the software engineering.

  - title: A Little More About Me
    layout: text
    content: |
      Alongside my interests in software engineering some of my other interests and hobbies are:
      - Gaming
      - Photography
      - Chess

